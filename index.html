<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Góc Manifest Mỗi Ngày</title>
<meta name="theme-color" content="#f3d9c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf6f1; --card:#ffffff; --ink:#3a2f2a; --muted:#8a7a70; --line:#efe3d8;
  --accent:#c77d5a; --accent2:#8e6bbf; --soft:#f6ebe2; --ok:#5a9a6e; --warn:#c0553f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
header{background:linear-gradient(135deg,#f3d9c8,#e3d3f2);padding:18px 16px 12px}
header h1{margin:0;font-size:22px}
#coreLine{margin-top:6px;font-style:italic;color:#5b4560;font-size:17px;min-height:26px;transition:opacity .6s}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 13px;font-size:15px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:19px}
.card h3{margin:12px 0 6px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.big{font-size:22px;font-weight:600;color:#5b4560;text-align:center;padding:10px 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:9px 15px;font-size:15px;cursor:pointer}
.btn.alt{background:var(--accent2)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--warn);border:1px solid var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
textarea,input[type=text],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit;background:#fffdfb;color:var(--ink)}
textarea{min-height:180px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px dashed var(--line);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.aff{display:flex;gap:8px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
.aff .t{flex:1}
.ico{border:none;background:none;font-size:18px;cursor:pointer;padding:2px 4px}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.day.today{border:2px solid var(--accent);background:#fff8f3}
.day.done{opacity:.8}
.day .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px}
.pill.ok{background:#e1f1e5;color:var(--ok)}
.entry{border-bottom:1px solid var(--line);padding:10px 2px}
.entry .meta{font-size:13px;color:var(--muted)}
.entry .body{white-space:pre-wrap;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.big{font-size:19px}}
#reader{position:fixed;inset:0;background:linear-gradient(160deg,#2b2140,#5a3f5e 60%,#c77d5a);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:50;text-align:center}
#reader .txt{font-size:clamp(24px,5vw,44px);font-weight:600;max-width:900px;line-height:1.35}
#reader .ctl{position:absolute;bottom:24px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#reader .cnt{position:absolute;top:18px;right:20px;opacity:.8}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#3a2f2a;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
.streak{font-size:28px;font-weight:700;color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--soft);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cal div.l1{background:#f1d7c6;color:#7a4b33}.cal div.l2{background:#e3a98b;color:#fff}.cal div.l3{background:var(--accent);color:#fff}
.hide{display:none}
label.sm{font-size:14px;color:var(--muted);display:block;margin:8px 0 3px}
#player{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:40}
#player.hide{display:none}
#player audio{flex:1;min-width:0;width:100%;height:38px}
@media (max-width:640px){#player{padding:8px 10px;gap:6px}#player #pName{width:100%;font-size:13px}#player select{flex:1}nav{position:static}}
#player #pName{font-size:14px;font-weight:600;max-width:100%}
body.playing main{padding-bottom:110px}
.track{display:flex;gap:8px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.track.on{background:#f3ecfa;border-radius:10px}
.track .t{flex:1}
</style>
</head>
<body>
<header>
  <h1>🌙 Góc Manifest Mỗi Ngày</h1>
  <div id="coreLine"></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<div id="reader">
  <div class="cnt" id="rCnt"></div>
  <div class="txt" id="rTxt"></div>
  <div class="ctl">
    <button class="btn ghost" id="rPrev">◀ Trước</button>
    <button class="btn" id="rPlay">⏸ Tạm dừng</button>
    <button class="btn ghost" id="rNext">Sau ▶</button>
    <button class="btn ghost" id="rVoice">🔊 Đọc to: tắt</button>
    <button class="btn danger" id="rClose">✕ Thoát</button>
  </div>
</div>
<div id="player" class="hide">
  <span id="pName"></span>
  <audio id="libAudio" controls></audio>
  <select id="pTimer" title="Hẹn giờ tắt nhạc" style="width:auto">
    <option value="0">Không hẹn giờ</option><option value="15">Tắt sau 15 phút</option><option value="30">Tắt sau 30 phút</option><option value="60">Tắt sau 1 tiếng</option><option value="120">Tắt sau 2 tiếng</option>
  </select>
  <button class="btn ghost" id="pStop">✕ Tắt nhạc</button>
</div>
<div class="toast" id="toast"></div>

/* ================== LƯU TRỮ (trên máy bạn) ================== */
const KEY = "goc_manifest_v1";
let S = load();
function load(){
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ d = {}; }
  return Object.assign({
    start:null, checks:{}, roadDone:{}, journal:[], myAff:[], favs:[], core:CORE_DEFAULT.slice(),
    roadmap:ROADMAP_DEFAULT.map(x=>Object.assign({},x)), goals:[], evidence:[], links:[], n369:{},
    set:{voice:"", rate:0.9, vol:0.3, gap:6}
  }, d);
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Không lưu được! Hãy bấm Sao lưu để giữ dữ liệu."); } }

/* ================== TIỆN ÍCH ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(ds){ const [y,m,d]=ds.split("-"); return d+"/"+m+"/"+y; }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function seedNum(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function pickDaily(arr, n, salt){ const out=[]; const a=arr.slice(); let h=seedNum(today()+(salt||"")); while(out.length<n && a.length){ h=(h*1103515245+12345)>>>0; out.push(a.splice(h%a.length,1)[0]); } return out; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function copy(txt){ navigator.clipboard.writeText(txt).then(()=>toast("Đã copy ✓")).catch(()=>{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Đã copy ✓"); }); }
function allAff(){ const list=[]; for(const c in AFF) AFF[c].forEach(t=>list.push({t,c})); S.myAff.forEach(t=>list.push({t,c:"Của tôi"})); return list; }
function wc(s){ return (s.trim().match(/\S+/g)||[]).length; }
function download(name, text, type){ const b=new Blob([text],{type:type||"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function roadDay(){ if(!S.start) return 0; const n=daysBetween(S.start,today())+1; return n; }
function chk(k){ const d=today(); S.checks[d]=S.checks[d]||{}; S.checks[d][k]=true; save(); }

/* ================== GIỌNG ĐỌC (trên máy) ================== */
let voices=[];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function viVoices(){ return voices.filter(v=>/^vi/i.test(v.lang)); }
function pickVoice(){
  const vs = voices; if(!vs.length) return null;
  let v = vs.find(x=>x.voiceURI===S.set.voice); if(v) return v;
  return viVoices().find(x=>x.localService) || viVoices()[0] || null;
}
function speak(text, vol, rate, onend){
  if(!("speechSynthesis" in window)){ onend&&onend(); return; }
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="vi-VN";
  u.volume = vol==null?1:vol; u.rate = rate||S.set.rate;
  u.onend = ()=>onend&&onend(); u.onerror = ()=>onend&&onend();
  speechSynthesis.speak(u);
}

function streak(){
  let n=0; const d=new Date();
  for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const c=S.checks[k]; const cnt=c?Object.values(c).filter(Boolean).length:0;
    if(cnt>0) n++; else if(k!==today()) break;
    d.setDate(d.getDate()-1); if(n>3650) break; }
  return n;
}

/* ================== CHẾ ĐỘ ĐỌC TOÀN MÀN HÌNH ================== */
let R={list:[],i:0,play:true,voice:false,timer:null,rounds:0};
function openReader(list){
  if(!list.length) return;
  R={list,i:0,play:true,voice:false,timer:null,rounds:0};
  $("#reader").style.display="flex"; showR(); schedule();
}
function showR(){ $("#rTxt").textContent=R.list[R.i]; $("#rCnt").textContent=(R.i+1)+" / "+R.list.length+(R.rounds?"  •  vòng "+(R.rounds+1):""); $("#rPlay").textContent=R.play?"⏸ Tạm dừng":"▶ Chạy tiếp"; $("#rVoice").textContent="🔊 Đọc to: "+(R.voice?"bật":"tắt"); }
function stepR(d){ R.i+=d; if(R.i>=R.list.length){ R.i=0; R.rounds++; } if(R.i<0) R.i=R.list.length-1; showR(); }
function schedule(){
  clearTimeout(R.timer); if(!R.play) return;
  if(R.voice){ speechSynthesis.cancel(); speak(R.list[R.i],1,S.set.rate,()=>{ if(R.play&&$("#reader").style.display==="flex"){ R.timer=setTimeout(()=>{ stepR(1); schedule(); },1500);} }); }
  else R.timer=setTimeout(()=>{ stepR(1); schedule(); }, (S.set.gap||6)*1000);
}
$("#rPrev").onclick=()=>{ stepR(-1); schedule(); };
$("#rNext").onclick=()=>{ stepR(1); schedule(); };
$("#rPlay").onclick=()=>{ R.play=!R.play; if(!R.play){ clearTimeout(R.timer); speechSynthesis.cancel(); } showR(); schedule(); };
$("#rVoice").onclick=()=>{ R.voice=!R.voice; speechSynthesis.cancel(); showR(); schedule(); };
$("#rClose").onclick=()=>{ clearTimeout(R.timer); speechSynthesis.cancel(); $("#reader").style.display="none"; if(tab==="home") home(); };

const TRACKS = [
  {file:"Subliminal - Self Concept x Detachment.mp3", orig:"𝐒𝐔𝐁𝐋𝐈𝐌𝐈𝐍𝐀𝐋  𓆩 𝐒𝐄𝐋𝐅 𝐂𝐎𝐍𝐂𝐄𝐏𝐓 × 𝐃𝐄𝐓𝐀𝐂𝐇𝐌𝐄𝐍𝐓 𓆪 - whatiwant igoteverything.mp3", label:"SUBLIMINAL 𓆩 Self Concept × Detachment 𓆪"},
  {file:"Subliminal CALM - Self Concept x Detachment.mp3", orig:"𝐒𝐔𝐁𝐋𝐈𝐌𝐈𝐍𝐀𝐋  𝐂𝐀𝐋𝐌 𓆩 𝐒𝐄𝐋𝐅 𝐂𝐎𝐍𝐂𝐄𝐏𝐓 × 𝐃𝐄𝐓𝐀𝐂𝐇𝐌𝐄𝐍𝐓 𓆪 - whatiwant igoteverything.mp3", label:"SUBLIMINAL CALM 𓆩 Self Concept × Detachment 𓆪"}
];
/* Thử nhiều chỗ đặt file: thư mục "nhac" hoặc ngay cạnh file này, tên gọn hoặc tên gốc */
function trackSrcs(t){
  const names=[t.file, t.orig, t.orig.replace(/ {2,}/g," ")];
  const out=[]; names.forEach(n=>{ out.push("nhac/"+encodeURIComponent(n)); out.push(encodeURIComponent(n)); });
  return [...new Set(out)];
}
let P={i:-1,mode:(S.set.pmode||"one"),sleep:null,srcs:[],si:0};
function playTrack(i){
  const au=$("#libAudio"); P.i=i; P.srcs=trackSrcs(TRACKS[i]); P.si=0;
  au.src=P.srcs[0];
  au.loop = P.mode==="one";
  au.play().catch(()=>{});
  $("#pName").textContent="🎵 "+TRACKS[i].label;
  $("#player").classList.remove("hide"); document.body.classList.add("playing");
  chk("sub"); if(tab==="sub") sub();
}
(function(){
  const au=$("#libAudio");
  au.onended=()=>{ if(au.loop||P.i<0) return; playTrack((P.i+1)%TRACKS.length); };
  au.onerror=()=>{ if(!au.getAttribute("src")) return; if(P.si<P.srcs.length-1){ P.si++; au.src=P.srcs[P.si]; au.play().catch(()=>{}); return; } toast("Không tìm thấy file nhạc. Kiểm tra 2 bài nhạc đã được tải lên chưa."); };
  au.onpause=au.onplay=()=>{ if(tab==="sub") sub(); };
  $("#pStop").onclick=()=>{ au.pause(); au.removeAttribute("src"); au.load(); P.i=-1; clearTimeout(P.sleep); $("#pTimer").value="0"; $("#player").classList.add("hide"); document.body.classList.remove("playing"); if(tab==="sub") sub(); };
  $("#pTimer").onchange=e=>{ clearTimeout(P.sleep); const m=+e.target.value; if(m>0){ P.sleep=setTimeout(()=>{ au.pause(); $("#pTimer").value="0"; toast("Đã tắt nhạc theo hẹn giờ 🌙"); }, m*60000); toast("Nhạc sẽ tắt sau "+m+" phút"); } };
})();

function sub(){
  const au=$("#libAudio");
  $("#app").innerHTML=`
  <div class="card">
    <h2>🎧 Subliminal của bạn</h2>
    <p class="muted">Bấm ▶ để nghe. Nhạc phát ở thanh dưới đáy màn hình, nên bạn chuyển qua viết nhật ký hay đọc khẳng định vẫn nghe tiếp được.</p>
    ${TRACKS.map((t,i)=>`<div class="track ${P.i===i?"on":""}"><button class="btn ${P.i===i?"alt":""}" data-pl="${i}">${P.i===i&&!au.paused?"⏸":"▶"}</button><span class="t">${esc(t.label)}</span></div>`).join("")}
    <div class="row" style="margin-top:12px">
      <label class="sm" style="margin:0">Khi hết bài:</label>
      <select id="pMode" style="width:auto"><option value="one" ${P.mode==="one"?"selected":""}>Lặp lại bài đó</option><option value="all" ${P.mode==="all"?"selected":""}>Chuyển sang bài còn lại</option></select>

  </div>`;
  $("#app").querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.pl; if(P.i===i){ if(au.paused) au.play(); else au.pause(); return; } playTrack(i); });

function sessionDraft(){ try{ return sessionStorage.getItem("jdraft")||""; }catch(e){ return ""; } }
function jTick(){ const el=$("#jLeft"); if(!jTimer){ if(el) el.textContent=""; return; } const s=Math.max(0,Math.round((jEnd-Date.now())/1000)); if(el) el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); if(s<=0){ clearInterval(jTimer); jTimer=null; toast("Hết 10 phút! Giỏi lắm 🎉"); if(tab==="jour"){ const v=$("#jText")&&$("#jText").value; jour(); } } }

    </div>`; }).join("")}`;
  $("#rStart").onclick=()=>{ if(S.start && !confirm("Bắt đầu lại từ Ngày 1 tính từ hôm nay?\n(Nhật ký và các dữ liệu khác vẫn giữ nguyên, chỉ bỏ các dấu ✓ của lộ trình.)")) return; S.start=today(); S.roadDone={}; roadOpen=0; save(); road(); toast("Ngày 1 bắt đầu ✨"); };
  $("#rReset").onclick=()=>{ if(confirm("Thay toàn bộ nội dung 12 ngày bằng bản mẫu? Những gì bạn đã sửa sẽ mất.")){ S.roadmap=ROADMAP_DEFAULT.map(x=>Object.assign({},x)); save(); road(); } };
  $("#app").querySelectorAll("[data-o]").forEach(h=>h.onclick=()=>{ const i=+h.dataset.o; roadOpen = roadOpen===i?-1:i; roadEdit=null; road(); });
  $("#app").querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>speak(S.roadmap[b.dataset.rs].a,1));
  $("#app").querySelectorAll("[data-rd]").forEach(c=>c.onchange=()=>{ S.roadDone[c.dataset.rd]=c.checked; if(c.checked && +c.dataset.rd===dn-1) chk("road"); save(); road(); });
  $("#app").querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>{ jMode="Nhật ký"; jPrompt=S.roadmap[b.dataset.rw].q; tab="jour"; render(); });
  $("#app").querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>{ roadEdit=+b.dataset.re; road(); });
  if($("#eSave")) $("#eSave").onclick=()=>{ const r=S.roadmap[roadEdit]; ["t","m","task","a","q"].forEach(k=>r[k]=$("#e_"+k).value.trim()||r[k]); roadEdit=null; save(); road(); toast("Đã lưu ✓"); };
  if($("#eCancel")) $("#eCancel").onclick=()=>{ roadEdit=null; road(); };
}

/* ================== TAB: SAO LƯU ================== */
function data(){
  $("#app").innerHTML=`
  <div class="card">
    <h2>💾 Dữ liệu của bạn nằm ở đâu?</h2>
    <p>Mọi thứ bạn viết được lưu <b>ngay trong trình duyệt trên máy này</b>, không gửi đi đâu cả. Nhưng nếu bạn xóa lịch sử/dữ liệu trình duyệt, hoặc đổi máy, dữ liệu sẽ mất.</p>
    <p>👉 Nên bấm <b>“Tải bản sao lưu”</b> khoảng 1 lần/tuần. File sẽ nằm trong thư mục <b>Downloads (Tải xuống)</b>.</p>
    <div class="row"><button class="btn" id="dExp">⬇️ Tải bản sao lưu (.json)</button>
      <label class="btn ghost" style="cursor:pointer">⬆️ Khôi phục từ bản sao lưu<input type="file" id="dImp" accept=".json,application/json" class="hide"></label></div>
    <p class="muted" style="margin-top:10px">Đang có: ${S.journal.length} bài nhật ký • ${S.myAff.length} câu khẳng định riêng • ${S.favs.length} câu yêu thích • ${S.goals.length} điều ước • ${S.evidence.length} bằng chứng.</p>
  </div>
  <div class="card">
    <h2>⚙️ Cài đặt chế độ đọc toàn màn hình</h2>
    <label class="sm">Mỗi câu hiện trong bao nhiêu giây (khi không bật đọc to)</label>
    <select id="dGap">${[4,6,8,10,15].map(s=>`<option value="${s}" ${S.set.gap==s?"selected":""}>${s} giây</option>`).join("")}</select>
  </div>`;
  $("#dExp").onclick=()=>{ download("sao-luu-goc-manifest-"+today()+".json", JSON.stringify(S,null,1), "application/json"); toast("Đã tải về thư mục Downloads ✓"); };
  $("#dImp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d||typeof d!=="object"||!("journal" in d)) throw 0; if(!confirm("Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu này?\nBản sao lưu có "+(d.journal||[]).length+" bài nhật ký.")) return; localStorage.setItem(KEY, JSON.stringify(d)); S=load(); toast("Đã khôi phục ✓"); data(); }catch(err){ toast("File không đúng định dạng sao lưu"); } }; rd.readAsText(f); };
  $("#dGap").onchange=e=>{ S.set.gap=+e.target.value; save(); };
}

save();
render();
</script>
</body>
